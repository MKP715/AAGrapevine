  - Weekly Open
  - AA Grapevine's Podcast
  - AA Grapevine Podcast
  - Ask-It-Basket         # podcast segments
  - Stump the Thumpers
  - Stump the Thumper
  - Blast From the Past
  - At Wit's End          # humor section of the magazine
  - Wit's End
  - Classic Grapevine     # magazine section (reprinted classic stories)
  - Sound Off
  # AA and our Area
  - AA
  - A.A.
  - NETA 65
  - NETA65
  - NETA
  # Short names used by the committee
  - GV
  - LV
  - GV/LV
  - AAGV
  - AALV
  - GVR
  - GVRs
  - RLV
  - RLVs
