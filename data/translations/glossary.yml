# =====================================================================
#  TRANSLATION GLOSSARY  (English ⇄ Spanish)
#
#  The site translates every title, summary and announcement
#  automatically with an open-source translation model. The model does
#  not know AA vocabulary, so this file tells it:
#
#   1. KEEP  – names that must never be translated
#              ("Grapevine" must not become "abuelo"!).
#   2. TERMS – words and phrases that always get the same translation
#              ("home group" is "grupo base", not "grupo de casa").
#
#  HOW TO EDIT (right on github.com → pencil icon → "Commit changes"):
#   * Matching ignores capital letters and accents ("la vina" matches
#     "La Viña") and only matches whole words.
#   * A name written in ALL CAPITALS (AA, GVR, DCM …) only matches when
#     it is written in capitals in the text too.
#   * Longer phrases win over shorter ones, so a specific phrase such as
#     "Twelve Traditions Checklist" beats "Twelve Traditions".
#   * Add `exact: true` to a term to require the same capital letters
#     (useful for a name that is also an everyday phrase).
#   * Add `only: es` to use a term only when translating INTO Spanish,
#     or `only: en` to use it only when translating INTO English.
#   * Tip: add the plural as its own line when it matters
#     ("sponsor" and "sponsors").
#   * Changing this file re-translates only the texts that contain the
#     changed words (on the next daily run).
#   * To fix ONE specific title, use overrides.yml instead.
# =====================================================================

# ---------------------------------------------------------------------
#  1) KEEP — written exactly the same in English and Spanish
# ---------------------------------------------------------------------
