# =====================================================================
#  Translation fixes. The site machine-translates titles and summaries
#  (open-source Argos/OPUS-MT models). If one comes out wrong, add the
#  exact original text and the translation you want. Overrides always win.
#
#  Format (quotes are safest):
#    "Original text exactly as on the site": { es: "Spanish you want" }
#    "Texto original en español":             { en: "English you want" }
#  A fix for a whole title also fixes it when a " [Season …]" or
#  " (Spanish)" tail follows, because those tails are translated apart.
#  For a word or phrase that appears in many texts, use glossary.yml.
# =====================================================================

