# ---------------------------------------------------------------------
#  Library (/library/): official AA documents only
#  A document is kept only when its FILE is on one of these hosts (a
#  subdomain such as www. counts too). aaws.widen.net = the asset
#  library of AA World Services. Documents found on other sites (e.g. a
#  local event flyer linked from a Grapevine event page) are left out,
#  and the crawler no longer records them (scripts/sync/crawl_rules.py).
# ---------------------------------------------------------------------
library:
  official_hosts:
    - aagrapevine.org
    - aalavina.org
    - aa.org
    - aaws.widen.net

# ---------------------------------------------------------------------
#  Optional weekly e-mail digest (off unless these GitHub secrets exist):
#  SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, DIGEST_TO
#  (DIGEST_TO can be a Google Group address that reaches all districts)
# ---------------------------------------------------------------------
digest:
  weekday: "monday"
  days: 7
