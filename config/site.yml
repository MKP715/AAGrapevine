# =====================================================================
#  NETA 65 Grapevine / La Viña Committee — SITE SETTINGS
#  This is the ONE file you edit for settings. Everything else
#  (articles, PDFs, podcasts, videos, Instagram, Drive uploads,
#  translations) updates itself every day via GitHub Actions.
#
#  Tip: edit right on github.com (pencil icon) → "Commit changes".
#  The site rebuilds automatically in about 10–20 minutes.
# =====================================================================

site:
  title: "Grapevine / La Viña"
  title_es: "Grapevine / La Viña"
  committee: "NETA 65 Grapevine & La Viña Committee"
  committee_es: "Comité de Grapevine y La Viña de NETA 65"
  area: "Northeast Texas Area 65"
  area_es: "Área 65 del Noreste de Texas"
  # Full public URL of the site (used in feeds, QR codes, share links).
  # GitHub Pages default: https://<user>.github.io/<repo>/
  url: "https://mkp715.github.io/AAGrapevine"
  timezone: "America/Chicago"
  default_lang: "en"
  languages: ["en", "es"]
  contact_email: "grapevine@neta65.org"
  area_website: "https://neta65.org"
  committee_page: "https://neta65.org/trusted-servants/grapevine-la-vina/"
  # /listen/ sidebar: an official AA Grapevine YouTube Short (the id is the last part of
  # youtube.com/shorts/<id>), shown as a privacy-friendly vertical player. Delete these lines to hide it.
  listen:
    sidebar_short: "0uyVPlTcSeI"
    sidebar_short_title: "Grapevine Get The App!"

# ---------------------------------------------------------------------
#  Committee meeting (next date + countdown are computed automatically)
# ---------------------------------------------------------------------
meeting:
  # Recurrence: which weekday of the month (1-5, or -1 for "last").
  week_of_month: 3
  weekday: "wednesday"
  start: "19:00"          # 24h, Central time
  end: "20:00"
  platform: "Zoom"
  # The official "ZOOM Link" from the committee page (neta65.org/trusted-servants/grapevine-la-vina/).
  # Zoom's pwd= is an encoded token, not the passcode itself — copy the whole link from Zoom.
  zoom_url: "https://us02web.zoom.us/j/9494767497?pwd=ZnlwNkxaRysxd3BJNUNRcWZsV3RNdz09"
  meeting_id: "949 476 7497"
  passcode: "neta65"
  chair_title: "Grapevine / La Viña Chair"
  chair_title_es: "Coordinador(a) de Grapevine / La Viña"
  chair_email: "grapevine@neta65.org"
  note: "All AA members are welcome to attend. No registration required."
  # Dates to skip (e.g. a holiday) — "YYYY-MM-DD"
  skip_dates: []

# ---------------------------------------------------------------------
#  Recurring events — things the committee does EVERY MONTH (a booth,
#  a workshop …). Each one shows on the Events page, the home page, the
#  calendar feed, the weekly digest and the search, with the next dates
#  worked out automatically (Central time, daylight saving included).
#
#  To add one: copy the block that starts with "- key:" (keep the
#  spaces at the start of each line), paste it below the last one and
#  change the values. To stop one: delete its block.
#  If a block has a mistake, the rest of the site still updates; the
#  problem is listed in the Actions run summary (and in status.json).
# ---------------------------------------------------------------------
recurring_events:
  - key: "citywide-dallas"         # short name: letters, numbers and dashes. Keep it the same
                                   # once published (calendars use it to recognize the event)
    title: "GV/LV booth at CityWide Dallas"
    title_es: "Mesa de GV/LV en CityWide Dallas"
    summary: "Stop by our Grapevine and La Viña literature table at CityWide Dallas, the monthly AA gathering at Lover's Lane United Methodist Church (potluck at 5:30 PM, speaker at 7:00 PM). Browse the magazines and ask us how to subscribe or how to become a GVR or RLV."
    summary_es: "Visita nuestra mesa de literatura de Grapevine y La Viña en CityWide Dallas, la reunión mensual de AA en la Iglesia Metodista Unida Lover's Lane (comida compartida a las 5:30 p. m. y orador a las 7:00 p. m.). Hojea las revistas y pregúntanos cómo suscribirte o ser RLV o GVR."
    # When: which weekday of the month (1-5, or -1 for "the last one")
    week_of_month: 2
    weekday: "saturday"
    start: "17:00"                 # 24-hour clock, Central time
    end: "20:00"
    location: "Lover's Lane United Methodist Church, 9200 Inwood Road, Dallas, TX 75220"
    url: "https://citywidedallasaa.org"   # "Event details" link (optional)
    months_ahead: 6                # how many upcoming dates to list on /events/ and in the calendar
                                   # feed (the /monthly/ posters work out later months from this rule)
    skip_dates: []                 # months with no booth, e.g. ["2026-12-12"] (that month's 2nd Saturday)

# ---------------------------------------------------------------------
#  Google Drive — the committee's upload area
#  Upload PDFs / photos / slides into the category folders inside your
#  Panel folder. Sub-folders are followed automatically (a sub-folder
#  inside "photos" becomes its own album).
#
#  Recognized category folder names (any capitalization; English or
#  Spanish): reports/informes, notes/notas/minutes/actas,
#  slides/presentaciones, flyers/volantes, photos/fotos,
#  workshops/talleres, announcements/anuncios, forms/formularios.
#  Any other folder name shows up in the Library under its own name.
#
#  FLYERS → EVENTS: name a flyer with its date and it becomes an event.
#  You can add a time and a place too:
#    "2027-03-14 Spring Assembly GV booth.pdf"
#    "2027-03-14 Spring Assembly booth 9am @ Tyler Civic Center.pdf"
#  ANNOUNCEMENTS: put a Google Doc (or .txt/.docx) in "announcements"; the
#  doc's name is the headline. Start the name with a date to set it:
#  "2027-01-10 Welcome new GVRs". Add "(pinned)" / "(fijado)" to keep it
#  on top, and "(until 2027-02-01)" / "(hasta 2027-02-01)" to hide it
#  after that date.
#  PHOTOS: each sub-folder inside "photos" becomes an album. Please only
#  upload photos where no AA member's face can be identified.
# ---------------------------------------------------------------------
drive:
  # The shared "A65_GV" folder (must be "Anyone with the link: Viewer").
  root_folder_id: "1cTCFxTujRm-m8Xn0OobJGH2EIWI753S1"
  # Sub-folders whose name matches this pattern are PANEL folders.
  panel_folder_pattern: "Panel\\s*(\\d+)"
  # Only show panels this number or newer (older panels are ignored).
  min_panel: 77
  # Also include category folders that sit directly in the root
  # (outside any Panel folder)? false = start clean with the new panel.
  include_loose_folders: false
  # Never publish these file types (response spreadsheets can contain
  # personal info).
  exclude_mime_contains: ["spreadsheet"]
  # Exclude any file/folder whose name contains one of these (case-insensitive)
  exclude_name_contains: ["(Responses)", "(Respuestas)", "PRIVATE", "PRIVADO", "wrong size"]
  # Optional: a Google API key makes dates exact (else dates come from
  # file names / first-seen). Set as GitHub secret GOOGLE_API_KEY.

# ---------------------------------------------------------------------
#  Content sources (checked daily)
# ---------------------------------------------------------------------
sources:
  grapevine:
    base: "https://www.aagrapevine.org"
    magazine_hub: "/magazine"
    contribute: "/contribute"
    weekly_open: "/grapevine-weekly-open"
    gvr_resources: "/gvr-resources"
    # Official store pages read daily by scripts/sync/shop.py (→ data/site/shop.json):
    # the Book of the Month offer, and the subscription prices per region. The region
    # listings are found on the `subscriptions` page; these are the fallback.
    botm: "/BOTM"
    subscriptions: "/store/grapevine-subscriptions"
    subscription_regions:
      us: "/store/us-subscriptions"
      ca: "/store/canada-subscriptions"
      intl: "/store/international-subscriptions"
    # The Audio Project (members record a story by phone or send a recording), read daily by
    # scripts/sync/audio_project.py (→ data/site/audio_project.json → /contribute/#record).
    audio_project: "/audio-portal"
    # The page with the "Grapevine Daily Quote" (#quote-of-the-day), read by scripts/sync/quote.py
    # in the daily run and again at 12:07 UTC (→ data/site/quote.json → the home page card).
    quote_page: "/"
  lavina:
    base: "https://www.aalavina.org"
    magazine_hub: "/la-revista"
    contribute: "/temas-sugeridos"
    rlv_resources: "/recursos"
    botm: "/libro-del-mes"
    subscriptions: "/tienda/suscripciones"
    subscription_regions:
      us: "/US-suscripciones"
      ca: "/tienda/canada-suscripciones"
      intl: "/tienda/internacional-suscripciones"
    # "Graba tu historia" (a story by phone or a recording by e-mail), read daily by
    # scripts/sync/audio_project.py with its instructions page; the other three are only linked.
    record_story: "/graba-tu-historia"
    record_instructions: "/instrucciones-graba-tu-historia"
    record_tips: "/consejos-de-grabacion"
    record_topics: "/temas-sugeridos"
    sample_audio: "/audio-de-muestra"
    # The page with the "Cita Diaria con La Viña" (#quote-of-the-day) — scripts/sync/quote.py.
    quote_page: "/"
  crawler:
    hosts: ["www.aagrapevine.org", "www.aalavina.org"]
    user_agent: "NETA65-GrapevineCommitteeBot/2.0 (+https://github.com/MKP715/AAGrapevine)"
    # Minutes of crawling per daily run. The sites ask for 5 s between
    # requests, so ~40 min ≈ 450 pages/day; the crawler resumes daily.
    # 0 = pause the PDF search (everything else keeps updating).
    minutes_per_run: 40
    # Re-check each already-known page at most every N days.
    recheck_days: 21
    # Download new PDFs for title/page-count/thumbnail (per run cap).
    pdf_details_per_run: 40
    pdf_max_mb: 60        # the monthly GV News PDF is ~43 MB
  youtube:
    channels:
      - id: "UCI9uFLJ__aXT3-At0PlPWUQ"
        handle: "@AAGrapevine"
        name: "AA Grapevine & La Viña"
  podcasts:
    - key: "gv"
      name: "AA Grapevine's Podcast"
      feed: "https://feeds.captivate.fm/aa-grapevine/"
      apple: "https://podcasts.apple.com/us/podcast/aa-grapevines-podcast/id1591924167"
      spotify: "https://open.spotify.com/show/714djcL57SFf0Nzf40CL8Q"
      amazon: "https://music.amazon.com/podcasts/de231bfa-837b-4a27-a331-a927019cb5d7"
      web: "https://www.aagrapevine.org/podcasts"
    - key: "wo"
      name: "Grapevine Weekly Open AA Meeting"
      feed: "https://feeds.captivate.fm/grapevine-weekly-open/"
      web: "https://www.aagrapevine.org/grapevine-weekly-open"
      apple: "https://podcasts.apple.com/us/podcast/grapevine-weekly-open-aa-meeting/id1874809908"
      spotify: "https://open.spotify.com/show/2jk469TmDC31spPqf8L0SF"
      amazon: "https://music.amazon.com/podcasts/8dfb5269-8733-42f3-b075-2d9e596bf4c5/grapevine-weekly-open-aa-meeting"
  instagram:
    accounts:
      - key: "gv"
        username: "alcoholicsanonymous_gv"
        name: "AA Grapevine"
      - key: "lv"
        username: "alcoholicosanonimos_lv"
        name: "La Viña"
    # Optional official API (most reliable, and the method Instagram's
    # terms allow). Set GitHub secrets IG_ACCESS_TOKEN and IG_BUSINESS_ID
    # to enable Business Discovery (steps in README).
    # anonymous: true  → also read Instagram's public embed pages without
    #   an API key (tiny volume, but Instagram's terms discourage automated
    #   collection). Set to false to use ONLY the official API + the manual
    #   list in content/instagram.yml.
    anonymous: true
    keep_per_account: 60     # newest posts kept per account
    enrich_per_run: 25       # max post look-ups per daily run
    graph_version: "v21.0"
    # Optional public RSSHub mirrors to try (leave empty to skip).
    rsshub_instances: []
  # -------------------------------------------------------------------
  #  Other calendars (optional) — public calendar files (.ics, "iCal")
  #  whose events also show on the Events page. Each one needs:
  #    url:       the calendar file's address (https:// or webcal://)
  #    label:     its name on the Status page (label_es: in Spanish)
  #    category:  where its events show on the Events page:
  #               "neta65" = with the NETA 65 events (workshops,
  #               assemblies …); "gv-calendar" / "lv-calendar" = with
  #               the Grapevine / La Viña calendars.
  #  The same event in a calendar AND on our Events page already
  #  (content/events, a flyer, the booth or the meeting above) shows
  #  ONCE (your content/events file wins, with your own Spanish).
  #  These are extras: if one can't be read, the site keeps its last
  #  good copy (or simply shows the events from content/events), the
  #  Status page says why, and no "stopped updating" issue is opened.
  #  The robot asks each calendar at most once a day.
  # -------------------------------------------------------------------
  ics_feeds:
    # The NETA 65 workshop calendar (neta65.org/events/category/workshop/).
    # NOTE: neta65.org is behind Cloudflare's "Just a moment…" bot check,
    # which turns away every robot — ours too (the Status page shows
    # "Blocked by the site's bot protection"). Nothing breaks, but until
    # it is unblocked a workshop or assembly shows on the Events page
    # only after someone adds it by hand to content/events.
    # To get it working, ask the Area webmaster to let calendar requests
    # through Cloudflare, for example with a WAF custom rule
    # (Security → WAF → Custom rules → action "Skip") for requests whose
    # query string contains "ical=1", or for the User-Agent in
    # `crawler: user_agent` above. ("Allow verified bots" alone is not
    # enough: our small robot is not on Cloudflare's verified list.)
    # The robot then reads it again by itself — nothing to change here.
    - url: "https://neta65.org/events/category/workshop/list/?ical=1"
      label: "NETA 65 workshops"
      label_es: "Talleres de NETA 65"
      category: "neta65"

