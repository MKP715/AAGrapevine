# =====================================================================
#  Monthly e-mail digest (OPTIONAL — off until you add the secrets).
#
#  On the 1st of every month it sends one bilingual (English + Spanish)
#  e-mail — the same edition as the website's /digest/ page: what was
#  new last month, this month's magazine issues and "put it to work"
#  tips, the committee meeting, events, story deadlines and more —
#  e.g. to a Google Group that reaches every district.
#
#  Turn it on: Settings → Secrets and variables → Actions → add
#    SMTP_SERVER, SMTP_USERNAME, SMTP_PASSWORD, DIGEST_TO
#    (optional: SMTP_PORT, DIGEST_FROM, DIGEST_REPLY_TO)
#  Step-by-step instructions: README.md → "Monthly e-mail digest".
#
#  Preview without sending: Actions → "Monthly e-mail digest" →
#  Run workflow → leave "Preview only" ticked → download the preview
#  artifact. The "month" box previews another edition (e.g. 2026-11).
# =====================================================================
name: Monthly e-mail digest

on:
  schedule:
    # GitHub cron is always UTC: 15:05 UTC on the 1st = 10:05 AM Central in summer (CDT) and
    # 9:05 AM in winter (CST) — always after 6 AM Texas time, and after the morning updates
    # (update.yml: 10:17 and 12:07 UTC), so the edition includes the 1st's content.
    # Minute 5 avoids the top-of-the-hour rush, when GitHub delays scheduled jobs the most.
    - cron: "5 15 1 * *"
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Preview only — build the e-mail but don't send it (download it from the run's Artifacts)"
        type: boolean
        default: true
      month:
        description: "Edition to build, as YYYY-MM (empty = this month)"
        type: string
        default: ""

permissions:
  contents: read
  pages: read        # to look up the site's public address

concurrency:
  group: monthly-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Build & send the digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Is the e-mail digest set up?
        id: check
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "Preview mode — the e-mail will be built but not sent."
          elif [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$DIGEST_TO" ]; then
            echo "mode=send" >> "$GITHUB_OUTPUT"
          else
            echo "mode=off" >> "$GITHUB_OUTPUT"
            echo "::notice title=E-mail digest is off::Add the SMTP_SERVER, SMTP_USERNAME, SMTP_PASSWORD and DIGEST_TO secrets to turn it on (README → Monthly e-mail digest)."
            echo "E-mail digest is not set up — nothing to do. (This is normal.)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the repository
        if: steps.check.outputs.mode != 'off'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.check.outputs.mode != 'off'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML (reads config/site.yml and config/carry.yml)
        if: steps.check.outputs.mode != 'off'
        run: python -m pip install --quiet PyYAML

      - name: Find the site's public address
        id: site
        if: steps.check.outputs.mode != 'off'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The address GitHub Pages actually serves (custom domain included).
          # If this lookup fails, the digest falls back to site.url in config/site.yml.
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url' 2>/dev/null || true)"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Site address: ${url:-"(from config/site.yml)"}"

      - name: Build (and send) the digest
        if: steps.check.outputs.mode != 'off'
        env:
          PYTHONIOENCODING: utf-8
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_REPLY_TO: ${{ secrets.DIGEST_REPLY_TO }}
          SITE_URL: ${{ steps.site.outputs.url }}
          MODE: ${{ steps.check.outputs.mode }}
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          args=()
          # (the preview goes to the runner's temp folder: upload-artifact skips hidden folders like .tmp/)
          if [ "$MODE" = "preview" ]; then args+=(--dry-run --out-dir "$RUNNER_TEMP/digest-preview"); fi
          if [[ "${MONTH:-}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then args+=(--month "$MONTH"); fi
          python -m scripts.notify.send_digest "${args[@]}"

      - name: Keep the preview
        if: steps.check.outputs.mode == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: digest-preview
          path: ${{ runner.temp }}/digest-preview/
          if-no-files-found: warn
          retention-days: 14
