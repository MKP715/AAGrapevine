# =====================================================================
#  Pull request check — nothing is published.
#
#  For every pull request (for example Dependabot's monthly "chore(deps)"
#  and "chore(actions)" updates) this builds the website exactly like the
#  daily "Update & Deploy" does, and runs the offline Python tests.
#  A broken update then shows a red ✗ on the pull request BEFORE it is
#  merged, instead of stopping the daily site update afterwards.
#
#  Rule of thumb (README → Housekeeping): merge a pull request only when
#  it shows a green ✓.
# =====================================================================
name: Pull request check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the check that is running.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install site tools (Eleventy, Tailwind, …)
        run: npm ci --no-audit --no-fund

      - name: Build the website (as for GitHub Pages)
        env:
          # A project site lives in a folder named after the repository.
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npx @11ty/eleventy

      - name: Check the build
        run: |
          set -euo pipefail
          # Same checks as "Update & Deploy" → "Check the build".
          test -s _site/index.html || { echo "::error::_site/index.html is missing — the build did not produce a home page."; exit 1; }
          test -s _site/es/index.html || { echo "::error::_site/es/index.html is missing — the Spanish site was not built."; exit 1; }
          test -s _site/assets/css/main.css || { echo "::error::The stylesheet was not built."; exit 1; }
          pages=$(find _site -name '*.html' | wc -l)
          size=$(du -sm _site | cut -f1)
          echo "Built ${pages} pages, ${size} MB."
          echo "**Website:** ${pages} pages, ${size} MB — builds fine with this change." >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Python tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the tests
        # The translation models are not downloaded here, so the tests that need them
        # are skipped; everything else (text handling, content parsing, build rules) runs.
        run: python -m unittest discover -s tests -v
